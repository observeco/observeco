[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "observeco"
version = "0.1.0"
description = "Runtime observability for AI agent systems — pulse, circuit breaker, token compression, dashboard"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sean Foo", email = "sean@observeco.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "platformdirs>=4",
]

[project.optional-dependencies]
dashboard = ["jinja2>=3.1", "python-multipart>=0.0.9"]
graph = ["tree-sitter>=0.25", "tree-sitter-python>=0.25"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.3", "mypy>=1.0"]
watch = ["watchdog>=4"]

[project.scripts]
observeco = "observeco.cli:app"

[project.urls]
Homepage = "https://github.com/observeco/observeco"
Documentation = "https://github.com/observeco/observeco#readme"
Repository = "https://github.com/observeco/observeco"

[tool.hatch.build.targets.wheel]
packages = ["src/observeco"]

[tool.hatch.build]
exclude = ["references/"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/observeco/snapshot.py" = ["E501"]
"src/observeco/mcp_server.py" = ["E501"]
"src/observeco/dashboard/server.py" = ["E501", "E741"]
"src/observeco/cli.py" = ["E402"]
"src/observeco/cli/billing_wire.py" = ["E402"]
"src/observeco/heal/*" = ["E501"]
"src/observeco/graph/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
