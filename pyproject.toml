[project]
name = "observeco"
version = "0.3.0"
description = "Observability for local AI agents"
authors = [
    {name = "Sean Foo"},
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "fastapi>=0.100",
    "httpx>=0.24",
    "jinja2>=3.0",
    "packaging>=23.0",
    "platformdirs>=4.0",
    "colorama>=0.4.6",
    "psutil>=5.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.5",
    "pyyaml>=6.0",
    "requests>=2.28",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "typer>=0.10",
    "uvicorn[standard]>=0.20",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
]

[project.optional-dependencies]
desktop = ["pywebview"]

[project.scripts]
observeco = "observeco.cli:app"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"specs/scripts/*" = ["E402"]
"tests/*" = ["E402"]
"docs/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
    "license: tests for license/trial/grace functionality",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=6.0",
    "ruff>=0.15.19",
    "stripe>=5.0",
    "cryptography>=35.0",
]

[tool.setuptools.package-data]
observeco = ["dashboard/templates/*.html", "dashboard/static/*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
