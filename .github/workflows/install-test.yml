name: First-Run Audit
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Build and install
        run: |
          uv build
          uv pip install dist/*.whl --system
          observeco --version
      - name: First-Run Audit
        run: uv run python3 specs/scripts/first-run-audit.py
