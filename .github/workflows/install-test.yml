name: First-Run Audit
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Build and install
        run: |
          uv build
          uv pip install dist/*.whl --system
          observeco --version
      - name: Debug — print environment
        run: |
          echo "=== Python version ==="
          python3 --version
          echo "=== uv version ==="
          uv --version
          echo "=== Installed packages ==="
          uv run pip list 2>/dev/null || uv run python3 -m pip list
          echo "=== Package import check ==="
          uv run python3 -c "from observeco.dashboard.server import app; print('Import OK')" 2>&1 || echo "IMPORT FAILED"
          echo "=== Working directory ==="
          pwd
          ls -la
      - name: First-Run Audit
        run: uv run python3 specs/scripts/first-run-audit.py
