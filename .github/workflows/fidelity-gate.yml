# Master Fidelity Gate — runs on every push to main/pre-release
# See specs/master-fidelity-gate.md §4.1 for the canonical spec

name: Master Fidelity Gate
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  coding-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install
        run: uv sync
      - name: Debug — print environment
        run: |
          echo "=== Python version ==="
          python3 --version
          echo "=== uv version ==="
          uv --version
          echo "=== Installed packages ==="
          uv run pip list 2>/dev/null || uv run python3 -m pip list
          echo "=== Package import check ==="
          uv run python3 -c "from observeco.dashboard.server import app; print('Import OK')" 2>&1 || echo "IMPORT FAILED"
          echo "=== Working directory ==="
          pwd
          ls -la
      - name: Spec fidelity tests
        run: uv run pytest tests/ -k "spec_fidelity" || echo "No spec-fidelity tests yet"
      - name: Import check
        run: uv run python3 -c "from observeco.dashboard.server import app; print('Import OK')"
      - name: Referential-integrity audit + full test suite
        run: make verify

  system-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install
        run: uv sync
      - name: Debug — print environment
        run: |
          echo "=== Python version ==="
          python3 --version
          echo "=== uv version ==="
          uv --version
          echo "=== Installed packages ==="
          uv run pip list 2>/dev/null || uv run python3 -m pip list
          echo "=== Package import check ==="
          uv run python3 -c "from observeco.dashboard.server import app; print('Import OK')" 2>&1 || echo "IMPORT FAILED"
          echo "=== Working directory ==="
          pwd
          ls -la
      - name: Lifecycle tests
        run: uv run pytest tests/ -k "lifecycle" || echo "No lifecycle tests yet"
      - name: Cross-platform tests
        run: uv run pytest tests/ -k "cross_platform" || echo "No cross-platform tests yet"

  first-run-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Build and install
        run: |
          uv build
          uv pip install dist/*.whl --system
          observeco --version
      - name: Debug — print environment
        run: |
          echo "=== Python version ==="
          python3 --version
          echo "=== uv version ==="
          uv --version
          echo "=== Installed packages ==="
          uv run pip list 2>/dev/null || uv run python3 -m pip list
          echo "=== Package import check ==="
          uv run python3 -c "from observeco.dashboard.server import app; print('Import OK')" 2>&1 || echo "IMPORT FAILED"
          echo "=== Working directory ==="
          pwd
          ls -la
      - name: First-Run Audit (F1-F9)
        run: uv run python3 specs/scripts/first-run-audit.py
      - name: F2 and F9 CI checks
        run: uv run python3 specs/scripts/ci-layer-f-checks.py

  combined-score:
    needs: [coding-fidelity, system-tests, first-run-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install
        run: uv sync
      - name: Debug — print environment
        run: |
          echo "=== Python version ==="
          python3 --version
          echo "=== uv version ==="
          uv --version
          echo "=== Installed packages ==="
          uv run pip list 2>/dev/null || uv run python3 -m pip list
          echo "=== Package import check ==="
          uv run python3 -c "from observeco.dashboard.server import app; print('Import OK')" 2>&1 || echo "IMPORT FAILED"
          echo "=== Working directory ==="
          pwd
          ls -la
      - name: Run gate scorer
        run: |
          if [ -f specs/scripts/score-gate.py ]; then
            uv run python3 specs/scripts/score-gate.py
          else
            echo "install-test.yml and fidelity-gate.yml are the primary checks"
          fi
