name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Debug — print environment
        run: |
          echo "=== Python version ==="
          python3 --version
          echo "=== uv version ==="
          uv --version
          echo "=== Installed packages ==="
          uv run pip list 2>/dev/null || uv run python3 -m pip list
          echo "=== Package import check ==="
          uv run python3 -c "from observeco.dashboard.server import app; print('Import OK')" 2>&1 || echo "IMPORT FAILED"
          echo "=== Working directory ==="
          pwd
          ls -la

      - name: Lint with ruff
        run: uv run ruff check src/observeco/

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov=observeco --cov-report=term-missing

      - name: Build package
        run: uv build
