<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2DD4BF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>

  <!-- Pulse/Heartbeat line -->
  <polyline points="8,64 28,64 34,40 40,80 46,36 52,88 58,44 64,64 70,44 76,88 82,36 88,80 94,40 100,64 120,64"
            fill="none" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Circuit nodes on the pulse line -->
  <circle cx="34" cy="40" r="4" fill="#0EA5E9" opacity="0.8"/>
  <circle cx="46" cy="36" r="4" fill="#14B8A6" opacity="0.8"/>
  <circle cx="58" cy="44" r="4" fill="#06B6D4" opacity="0.8"/>
  <circle cx="70" cy="44" r="4" fill="#0EA5E9" opacity="0.8"/>
  <circle cx="82" cy="36" r="4" fill="#14B8A6" opacity="0.8"/>
  <circle cx="94" cy="40" r="4" fill="#06B6D4" opacity="0.8"/>

  <!-- Small decorative dots at edges -->
  <circle cx="28" cy="64" r="2" fill="#0EA5E9" opacity="0.5"/>
  <circle cx="100" cy="64" r="2" fill="#0EA5E9" opacity="0.5"/>
</svg>
