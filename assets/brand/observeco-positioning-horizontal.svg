<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="800" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="100" fill="#0f172a" rx="4"/>

  <!-- Pulse icon -->
  <polyline points="10,50 22,50 26,38 30,62 34,34 38,66 42,40 46,50 50,40 54,66 58,34 62,62 66,38 70,50 82,50"
            fill="none" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="26" cy="38" r="2" fill="#22c55e" opacity="0.8"/>
  <circle cx="34" cy="34" r="2" fill="#16a34a" opacity="0.8"/>
  <circle cx="42" cy="40" r="2" fill="#15803d" opacity="0.8"/>
  <circle cx="50" cy="40" r="2" fill="#22c55e" opacity="0.8"/>
  <circle cx="58" cy="34" r="2" fill="#16a34a" opacity="0.8"/>
  <circle cx="66" cy="38" r="2" fill="#15803d" opacity="0.8"/>

  <!-- Logo text -->
  <text x="100" y="45" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="-0.02em">ObserveCo</text>

  <!-- Separator dot -->
  <circle cx="260" cy="42" r="2" fill="#334155"/>

  <!-- Positioning statement -->
  <text x="275" y="45" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">Tells you if your AI agents are working, what they're doing, and where your money goes.</text>
</svg>
