<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="ObserveCo — Differentiation strategy consultancy for Singapore small businesses">
  <rect width="1500" height="500" fill="#ffffff"/>
  <defs>
    <style>
      .brand {
        font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, 'Times New Roman', serif;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .tagline {
        font-family: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      .tagline-sub {
        font-family: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.01em;
      }
    </style>
  </defs>

  <!-- Logo — largest element -->
  <text class="brand" x="750" y="210" text-anchor="middle" font-size="150" fill="#1b1f24">ObserveCo<tspan fill="#0e6e5c">.</tspan></text>

  <!-- Positioning statement — headline -->
  <text class="tagline" x="750" y="300" text-anchor="middle" font-size="34" fill="#1b1f24">Differentiation strategy consultancy for Singapore small businesses</text>

  <!-- Positioning statement — supporting line -->
  <text class="tagline-sub" x="750" y="352" text-anchor="middle" font-size="24" fill="#4a525c">We provide the <tspan fill="#0e6e5c">clarity</tspan> as to why your customer hasn't chosen you, because we <tspan fill="#0e6e5c">observe</tspan> what you can't see from the inside.</text>
</svg>
