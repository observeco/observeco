<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ObserveCo — Agent Detail · raven (v2 Strong-Fit)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0f172a; --surface:#1e293b; --surface-hover:#253349; --surface-active:#334155;
  --border:#334155; --border-soft:#273548;
  --status-healthy:#22c55e; --status-warning:#eab308; --status-critical:#ef4444; --status-info:#3b82f6;
  --token-identity:#6366f1; --token-skills:#8b5cf6; --token-memory:#ec4899; --token-tools:#14b8a6; --token-guidance:#f97316;
  --fg:#f8fafc; --fg-2:#94a3b8; --fg-3:#64748b;
  --accent:#22c55e; --accent-on:#0c1628; --warn:#eab308; --danger:#ef4444; --meta:#3b82f6;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --text-xs:11px; --text-sm:12px; --text-base:14px; --text-lg:18px; --text-xl:24px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
  --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-pill:9999px;
  --ease:cubic-bezier(0.2,0,0,1); --fast:100ms; --base:150ms;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:var(--text-base);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent);border-radius:var(--radius-sm)}

/* demo backdrop + controls */
.demo-top{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-6);border-bottom:1px solid var(--border);background:#0c1322}
.demo-top .logo{display:flex;align-items:center;gap:9px}
.demo-top .logo-word{font-weight:700;font-size:14px}.demo-top .logo-word b{color:#fff}
.demo-top .note{font-size:var(--text-sm);color:var(--fg-3)}
.demo-top .right{margin-left:auto;display:flex;align-items:center;gap:var(--space-2)}
.demo-top .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);margin-right:4px}
.state-switch{display:flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.state-switch button{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-3);padding:6px 11px;transition:all var(--fast)}
.state-switch button.on{background:var(--surface-active);color:var(--fg)}

.scrim{position:fixed;inset:0;background:rgba(7,11,20,.72);display:flex;align-items:flex-start;justify-content:center;padding:48px 24px;z-index:50;overflow-y:auto}
.modal{width:760px;max-width:100%;background:var(--surface);border:1px solid var(--surface-active);border-radius:var(--radius-md);box-shadow:0 28px 80px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}

/* modal header */
.m-head{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-6);border-bottom:1px solid var(--border);box-shadow:inset 4px 0 0 var(--status-critical)}
.m-dot{width:10px;height:10px;border-radius:2px;background:var(--status-critical);box-shadow:0 0 0 3px rgba(239,68,68,.15);animation:pa 2.4s var(--ease) infinite}
@keyframes pa{0%,100%{box-shadow:0 0 0 3px rgba(239,68,68,.15)}50%{box-shadow:0 0 0 4px rgba(239,68,68,.32)}}
.m-name{font-family:var(--font-mono);font-weight:700;font-size:var(--text-xl);letter-spacing:-0.01em}
.m-badge{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--status-critical);background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:var(--radius-pill);padding:3px 9px}
.m-fw{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px 6px}
.m-sub{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-3);margin-left:6px}
.m-close{margin-left:auto;width:32px;height:32px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--fg-3);font-size:18px}
.m-close:hover{background:var(--surface-active);color:var(--fg)}

/* tabs */
.m-tabs{display:flex;gap:2px;padding:0 var(--space-6);border-bottom:1px solid var(--border);background:#0c1322}
.m-tab{font-size:var(--text-sm);font-weight:500;color:var(--fg-2);padding:11px 14px;position:relative;white-space:nowrap;transition:color var(--fast)}
.m-tab:hover{color:var(--fg)}
.m-tab.active{color:var(--fg);font-weight:600}
.m-tab.active::after{content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.m-tab .tcount{font-family:var(--font-mono);font-size:9px;background:var(--surface-active);color:var(--fg-2);border-radius:var(--radius-pill);padding:0 5px;margin-left:5px}
.m-tab .tcount.crit{background:var(--status-critical);color:#fff}

/* body */
.m-body{padding:var(--space-6);min-height:420px;max-height:62vh;overflow-y:auto}
.panel-pane{display:none}.panel-pane.show{display:block}

/* shared bits */
.so{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-soft);position:relative;font-size:var(--text-sm);margin-bottom:var(--space-4)}
.so::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.so .mk{flex-shrink:0;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;margin-top:1px}
.so .lead{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:2px}
.so .txt{color:var(--fg);line-height:1.45}.so .txt .num{font-family:var(--font-mono);font-weight:600}
.so .act{display:inline-flex;gap:4px;margin-top:5px;font-size:var(--text-xs);font-weight:600}.so .act:hover{text-decoration:underline}
.so.alert{background:rgba(239,68,68,.06)}.so.alert::before{background:var(--danger)}.so.alert .mk{background:rgba(239,68,68,.16);color:var(--danger)}.so.alert .lead,.so.alert .act{color:var(--danger)}
.so.watch{background:rgba(234,179,8,.06)}.so.watch::before{background:var(--warn)}.so.watch .mk{background:rgba(234,179,8,.16);color:var(--warn)}.so.watch .lead,.so.watch .act{color:var(--warn)}
.so.insight{background:rgba(34,197,94,.06)}.so.insight::before{background:var(--accent)}.so.insight .mk{background:rgba(34,197,94,.16);color:var(--accent)}.so.insight .lead,.so.insight .act{color:var(--accent)}
.so.neutral::before{background:var(--fg-3)}.so.neutral .mk{background:var(--surface-active);color:var(--fg-2)}.so.neutral .lead{color:var(--fg-3)}.so.neutral .act{color:var(--meta)}

.sec-h{font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-2);margin:var(--space-6) 0 var(--space-3);display:flex;align-items:center;gap:8px}
.sec-h:first-child{margin-top:0}
.sec-h .hint{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--fg-3);font-weight:400;text-transform:none;letter-spacing:0}
.tbl{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
.tbl th{text-align:left;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);padding:6px 10px;border-bottom:1px solid var(--border)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border-soft)}
.tbl td.mono,.tbl th.mono{font-family:var(--font-mono)}
.tbl tr:last-child td{border-bottom:none}
.card2{background:var(--bg);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:var(--space-4)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:var(--text-sm)}
.kv:last-child{border-bottom:none}.kv .k{color:var(--fg-2)}.kv .v{font-family:var(--font-mono)}
.conf{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-radius:var(--radius-pill);padding:3px 9px}
.conf .cd{width:6px;height:6px;border-radius:50%}
.conf.est{color:var(--warn);background:rgba(234,179,8,.1)}.conf.est .cd{background:var(--warn)}
.conf.acc{color:var(--accent);background:rgba(34,197,94,.1)}.conf.acc .cd{background:var(--accent)}

/* health: 48-dot pulse grid */
.pulse48{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin-bottom:var(--space-2)}
.pulse48 i{aspect-ratio:1;border-radius:1px;background:var(--status-healthy)}
.pulse48 i.e{background:var(--status-warning)}.pulse48 i.d{background:var(--status-critical)}
.pulse48 i.n{background:var(--surface-active)}
.pulse-axis{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9px;color:var(--fg-3)}
.latline{display:flex;align-items:flex-end;gap:2px;height:48px;margin:var(--space-2) 0;padding:var(--space-2);background:var(--bg);border:1px solid var(--border-soft);border-radius:var(--radius-sm)}
.latline i{flex:1;border-radius:1px 1px 0 0;background:var(--status-info);min-height:2px}
.latline i.e{background:var(--status-warning)}.latline i.d{background:var(--status-critical);min-height:2px;opacity:.4}

/* guard: failure timeline */
.ftl{position:relative;padding-left:var(--space-4);margin:var(--space-2) 0}
.ftl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border)}
.ftl .ev{position:relative;padding:8px 0 8px var(--space-4)}
.ftl .ev::before{content:'';position:absolute;left:-1px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--status-critical);border:2px solid var(--surface)}
.ftl .ev.trip::before{background:var(--fg);box-shadow:0 0 0 3px rgba(239,68,68,.3)}
.ftl .ev .t{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-3)}
.ftl .ev .m{font-size:var(--text-sm);margin-top:1px}
.ftl .ev .m b{font-family:var(--font-mono)}

/* tokens: component bars */
.compbar{display:flex;flex-direction:column;gap:9px}
.compbar .cb{display:grid;grid-template-columns:78px 1fr 92px;gap:10px;align-items:center}
.compbar .cb .lab{font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-2)}
.compbar .cb .track{height:14px;background:var(--bg);border-radius:3px;overflow:hidden}
.compbar .cb .track i{display:block;height:100%;border-radius:3px}
.compbar .cb .val{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-2);text-align:right}
.bi{background:var(--token-identity)}.bs{background:var(--token-skills)}.bm{background:var(--token-memory)}.bt{background:var(--token-tools)}.bg{background:var(--token-guidance)}
.toggle-row{display:flex;align-items:center;gap:var(--space-3);margin:var(--space-3) 0}
.seg{display:flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.seg button{font-size:var(--text-xs);font-weight:600;color:var(--fg-2);padding:6px 12px;transition:all var(--fast)}
.seg button.on{background:var(--surface-active);color:var(--fg)}

/* pro upsell */
.pro{border:1px dashed var(--border);border-radius:var(--radius-sm);padding:var(--space-4);background:var(--surface);opacity:.55;display:flex;align-items:center;gap:var(--space-3)}
.pro .pico{font-size:22px}
.pro h4{font-size:var(--text-sm);font-weight:600}.pro p{font-size:var(--text-xs);color:var(--fg-2)}
.pro .soon{margin-left:auto;font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--accent);background:rgba(34,197,94,.1);border-radius:var(--radius-pill);padding:3px 10px;white-space:nowrap}

/* memory: debt trend */
.debt-head{display:flex;align-items:flex-end;gap:var(--space-4);margin-bottom:var(--space-3)}
.debt-score{font-family:var(--font-mono);font-size:46px;font-weight:700;line-height:1;color:var(--status-critical)}
.debt-of{font-family:var(--font-mono);font-size:var(--text-sm);color:var(--fg-3)}
.debt-trend{display:flex;align-items:flex-end;gap:3px;height:46px;flex:1}
.debt-trend i{flex:1;border-radius:1px 1px 0 0;background:var(--status-warning);opacity:.5}
.debt-trend i:last-child{background:var(--status-critical);opacity:1}
.mstat{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);margin:var(--space-3) 0}
.mstat .ms{background:var(--bg);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:var(--space-3);text-align:center}
.mstat .ms .n{font-family:var(--font-mono);font-size:var(--text-xl);font-weight:700}
.mstat .ms .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3);margin-top:2px}
.mstat .ms.warn .n{color:var(--status-warning)}.mstat .ms.crit .n{color:var(--status-critical)}
.arch{display:flex;align-items:center;gap:var(--space-3);padding:9px 12px;border:1px solid var(--border-soft);border-radius:var(--radius-sm);margin-bottom:6px;font-size:var(--text-sm)}
.arch .ix{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-3)}
.arch .desc{flex:1}.arch .desc b{font-family:var(--font-mono)}
.arch .btn{font-size:var(--text-xs);font-weight:600;color:var(--accent);border:1px solid rgba(34,197,94,.3);border-radius:var(--radius-sm);padding:5px 10px}
.arch .btn:hover{background:rgba(34,197,94,.1)}

/* states: loading / empty / error */
.skel{background:linear-gradient(90deg,var(--surface-active) 25%,var(--surface-hover) 50%,var(--surface-active) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--radius-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.state-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--space-3);padding:var(--space-8);min-height:340px}
.state-msg .ico{width:48px;height:48px;border-radius:var(--radius-md);display:grid;place-items:center;font-size:22px;background:var(--bg);border:1px solid var(--border);color:var(--fg-3)}
.state-msg.err .ico{background:rgba(234,179,8,.1);border-color:rgba(234,179,8,.3);color:var(--status-warning)}
.state-msg h3{font-size:var(--text-lg);font-weight:600}.state-msg p{color:var(--fg-2);max-width:420px;font-size:var(--text-sm)}
.cmd{font-family:var(--font-mono);font-size:var(--text-sm);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--accent)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:680px){.modal{width:100%}.pulse48{grid-template-columns:repeat(12,1fr)}}
</style>
</head>
<body>
<div class="demo-top">
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 26 26" fill="none" aria-hidden="true"><polyline points="2,15 7,15 9.5,6 13.5,21 16,15 24,15" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="7.5" r="2.4" fill="#22c55e"/></svg>
    <span class="logo-word"><b>Observe</b>Co</span>
  </div>
  <span class="note">Agent detail — opens from the Health panel's "View full history →" link. Switch tab + state to inspect.</span>
  <div class="right">
    <span class="lbl">state</span>
    <div class="state-switch" id="stateSwitch">
      <button data-state="data" class="on">Data</button>
      <button data-state="loading">Loading</button>
      <button data-state="empty">Empty</button>
      <button data-state="error">Error</button>
    </div>
  </div>
</div>

<div class="scrim">
  <div class="modal" role="dialog" aria-label="Agent detail: raven">
    <div class="m-head">
      <span class="m-dot"></span>
      <span class="m-name">raven</span>
      <span class="m-badge">● Dead 2h 14m</span>
      <span class="m-fw">Hermes</span>
      <span class="m-sub">port 8204 · claude-sonnet-4 · since 02:11</span>
      <button class="m-close" aria-label="Close">×</button>
    </div>
    <nav class="m-tabs" id="mtabs">
      <button class="m-tab active" data-tab="health">Health</button>
      <button class="m-tab" data-tab="guard">Guard <span class="tcount crit">trip</span></button>
      <button class="m-tab" data-tab="errors">Errors <span class="tcount crit">5</span></button>
      <button class="m-tab" data-tab="tokens">Tokens</button>
      <button class="m-tab" data-tab="memory">Memory</button>
    </nav>
    <div class="m-body" id="mbody"></div>
  </div>
</div>

<script>
/* ── 48-beat pulse history for raven: healthy, then errors, then dead ── */
const PULSE48=(()=>{const a=[];for(let i=0;i<48;i++){if(i<40)a.push({s:'a',lat:90+Math.round(Math.sin(i/3)*30+Math.random()*40)});else if(i<43)a.push({s:'e',lat:600+Math.round(Math.random()*500)});else a.push({s:'d',lat:0});}return a;})();

const HEALTH={
  data(){
    const dots=PULSE48.map(p=>`<i class="${p.s==='a'?'':p.s}"></i>`).join('');
    const maxLat=Math.max(...PULSE48.map(p=>p.lat),1);
    const bars=PULSE48.map(p=>`<i class="${p.s==='e'?'e':p.s==='d'?'d':''}" style="height:${p.s==='d'?4:Math.max(4,p.lat/maxLat*100)}%"></i>`).join('');
    return `
    <div class="so alert"><span class="mk">!</span><div class="body"><span class="lead">Health · so what</span><span class="txt">Last <b class="num">5</b> pulses dead after <b class="num">3</b> errors at 03:14–03:15. Latency spiked to <b class="num">980ms</b> before it went silent — a slow failure, not an instant crash. Circuit tripped <b class="num">8s</b> later.</span></div></div>
    <div class="sec-h">Pulse timeline <span class="hint">last 48 beats · 30s cadence · 24m window</span></div>
    <div class="pulse48">${dots}</div>
    <div class="pulse-axis"><span>−24m</span><span>−18m</span><span>−12m</span><span>−6m</span><span>now</span></div>
    <div class="sec-h">Latency per beat <span class="hint">ms · red = dead</span></div>
    <div class="latline">${bars}</div>
    <div class="sec-h">Latest check</div>
    <table class="tbl"><tbody>
      <tr><td class="k">Status</td><td class="mono" style="color:var(--status-critical)">dead</td><td class="k">Checked</td><td class="mono">03:15:02</td></tr>
      <tr><td class="k">Latency</td><td class="mono">— (no response)</td><td class="k">Consecutive dead</td><td class="mono">5</td></tr>
      <tr><td class="k">Last alive</td><td class="mono">03:13:32</td><td class="k">Method</td><td class="mono">GET /healthz</td></tr>
    </tbody></table>
    <div class="sec-h">Confidence</div>
    <div class="card2">
      <div class="kv"><span class="k">Pulse source</span><span class="conf est"><span class="cd"></span>Estimated · watch-only</span></div>
      <div class="kv"><span class="k">False-positive risk</span><span class="v" style="color:var(--status-healthy)">Low — 5 consecutive dead beats</span></div>
      <div class="kv"><span class="k">False-negative risk</span><span class="v" style="color:var(--status-warning)">Medium — no OTEL confirmation</span></div>
      <div class="kv"><span class="k">Verdict</span><span class="v">Agent is almost certainly down. Install telemetry plugin to remove the FN risk.</span></div>
    </div>`;
  },
  empty(){return stateEmpty('No pulse history','raven has no pulse_log rows in this window — it may have been added after the last poll cycle.','observeco pulse check raven');},
};

const GUARD={
  data(){return `
    <div class="so alert"><span class="mk">!</span><div class="body"><span class="lead">Guard · so what</span><span class="txt">Circuit tripped after <b class="num">3</b> connection failures in <b class="num">90s</b>. Cooldown holds until <b class="num">11:15</b>. raven has been unreachable <b class="num">2h 14m</b> — start it manually or wait out the cooldown.</span><a href="#" class="act">Reset circuit now →</a></div></div>
    <div class="sec-h">Status</div>
    <div class="card2">
      <div class="kv"><span class="k">Circuit state</span><span class="v" style="color:var(--status-critical)">TRIPPED — open</span></div>
      <div class="kv"><span class="k">Failures before trip</span><span class="v">3 / 3 threshold</span></div>
      <div class="kv"><span class="k">Tripped at</span><span class="v">03:15:10</span></div>
      <div class="kv"><span class="k">Cooldown ends</span><span class="v">11:15:10 · in 4h 00m</span></div>
    </div>
    <div class="sec-h">Failure timeline <span class="hint">what tripped it</span></div>
    <div class="ftl">
      <div class="ev"><div class="t">03:13:40</div><div class="m">Failure <b>1/3</b> — connection refused on :8204</div></div>
      <div class="ev"><div class="t">03:14:25</div><div class="m">Failure <b>2/3</b> — connection refused on :8204</div></div>
      <div class="ev"><div class="t">03:15:08</div><div class="m">Failure <b>3/3</b> — connection refused on :8204</div></div>
      <div class="ev trip"><div class="t">03:15:10</div><div class="m"><b>Circuit tripped</b> — 4h cooldown started</div></div>
    </div>
    <div class="sec-h">What the guard does <span class="hint">plain English</span></div>
    <div class="so neutral"><span class="mk">i</span><div class="body"><span class="txt">A circuit breaker stops ObserveCo from hammering a dead agent. After 3 straight failures it "trips" and waits 4 hours before retrying, so a broken agent doesn't burn retries or rack up errors. While tripped, no health checks or heals run for raven — that's why the pulse timeline shows a flat dead tail.</span></div></div>
    <div class="sec-h">Settings</div>
    <div class="card2">
      <div class="kv"><span class="k">Failure threshold</span><span class="v">3 failures</span></div>
      <div class="kv"><span class="k">Cooldown duration</span><span class="v">4h 00m</span></div>
      <div class="kv"><span class="k">Auto-reset on success</span><span class="v" style="color:var(--status-healthy)">enabled</span></div>
    </div>`;},
};

const ERRORS={
  data(){return `
    <div class="so alert"><span class="mk">!</span><div class="body"><span class="lead">Errors · so what</span><span class="txt">All <b class="num">5</b> errors in 24h are <b>connection_refused</b> on :8204 — not scattered failures, one root cause: the process isn't listening. This is a "start the agent" problem, not a config or model problem.</span></div></div>
    <div class="sec-h">Errors <span class="hint">last 24h · 5 events</span></div>
    <table class="tbl"><thead><tr><th>Time</th><th>Type</th><th>Severity</th><th class="mono">Latency</th></tr></thead><tbody>
      <tr><td class="mono">03:15:08</td><td>connection_refused</td><td style="color:var(--status-critical)">critical</td><td class="mono">—</td></tr>
      <tr><td class="mono">03:14:25</td><td>connection_refused</td><td style="color:var(--status-critical)">critical</td><td class="mono">—</td></tr>
      <tr><td class="mono">03:13:40</td><td>connection_refused</td><td style="color:var(--status-critical)">critical</td><td class="mono">—</td></tr>
      <tr><td class="mono">02:48:11</td><td>timeout</td><td style="color:var(--status-warning)">warning</td><td class="mono">60,000ms</td></tr>
      <tr><td class="mono">02:11:03</td><td>http_5xx</td><td style="color:var(--status-warning)">warning</td><td class="mono">512ms</td></tr>
    </tbody></table>
    <div class="sec-h">Verdict</div>
    <div class="so neutral"><span class="mk">i</span><div class="body"><span class="txt">The 02:11 http_5xx and 02:48 timeout were the warning signs; by 03:13 the process stopped accepting connections entirely. The agent degraded for ~1 hour before it died — a window where an alert would have caught it.</span></div></div>
    <div class="sec-h">Deeper analysis</div>
    <div class="pro"><span class="pico">🔍</span><div><h4>Error clustering & root-cause</h4><p>Group errors across the fleet, correlate with drift and deploys, suggest fixes.</p></div><span class="soon">Pro · v1.0</span></div>`;},
  empty(){return stateEmpty('No errors','raven has no classified failures in the selected range. Widen the window or check another agent.','');},
};

const TOKENS={
  data(){
    return `
    <div class="so insight"><span class="mk">✦</span><div class="body"><span class="lead">Tokens · so what</span><span class="txt">raven holds <b class="num">38.2K</b> tokens of context but spent <b class="num">$0.00</b> in 24h — it's down, so nothing is firing. <b class="num">28%</b> is memory, the largest segment; that's where its debt sits. When it restarts, Lite compression would trim <b class="num">~6.1K</b> tokens.</span><a href="#" class="act">Preview compression →</a></div></div>
    <div class="sec-h">Component breakdown <span class="hint">38,214 tokens · estimated from SOUL.md</span></div>
    <div class="compbar" id="compbar"></div>
    <div class="toggle-row"><span style="font-size:12px;color:var(--fg-2)">View</span>
      <div class="seg" id="compSeg"><button class="on" data-c="before">Current</button><button data-c="after">After Lite compression</button></div>
      <span id="compNote" style="font-size:11px;color:var(--fg-3);font-family:var(--font-mono)"></span>
    </div>
    <div class="sec-h">Cost by model <span class="hint">24h · raven is down → $0</span></div>
    <table class="tbl"><thead><tr><th>Model</th><th>Provider</th><th class="mono">Calls 24h</th><th class="mono">Tokens</th><th class="mono">Cost</th></tr></thead><tbody>
      <tr><td class="mono">claude-sonnet-4</td><td>anthropic</td><td class="mono">0</td><td class="mono">0</td><td class="mono">$0.00</td></tr>
      <tr><td class="k" style="color:var(--fg-3)" colspan="5">Last billed call: 02:11 · $0.0041 · 1,180 tok</td></tr>
    </tbody></table>
    <div class="sec-h">Data quality</div>
    <div class="card2"><div class="kv"><span class="k">Token source</span><span class="conf est"><span class="cd"></span>Estimated · watch-only</span></div><div class="kv"><span class="k">Why</span><span class="v" style="text-align:right;max-width:60%">No OTEL records — 100% of this breakdown is inferred from the SOUL.md snapshot, not measured per-call.</span></div></div>`;
  },
  empty(){return stateEmpty('No token records','No token_logs rows for raven in this window. If it has never run with telemetry, install the Hermes plugin.','observeco plugin install hermes-telemetry');},
};

const MEMORY={
  data(){return `
    <div class="so watch"><span class="mk">↗</span><div class="body"><span class="lead">Memory · so what</span><span class="txt">Debt is <b class="num">62/100</b> — critical. It climbed from <b class="num">31</b> two weeks ago. Garden found <b class="num">2</b> contradictions (raven references both GPT-4 and Claude as "my model") and <b class="num">5</b> stale entries. Resolving them drops debt to <b class="num">~28</b>.</span><a href="#" class="act">Run garden scan →</a></div></div>
    <div class="sec-h">Debt score <span class="hint">clawforge_garden · 14-day trend</span></div>
    <div class="card2">
      <div class="debt-head">
        <div><span class="debt-score">62</span><span class="debt-of">/100</span></div>
        <div class="debt-trend"><i style="height:48%"></i><i style="height:50%"></i><i style="height:55%"></i><i style="height:58%"></i><i style="height:60%"></i><i style="height:66%"></i><i style="height:72%"></i><i style="height:78%"></i><i style="height:84%"></i><i style="height:90%"></i><i style="height:100%"></i></div>
      </div>
      <div style="font-size:11px;color:var(--fg-3);font-family:var(--font-mono)">31 → 48 → 62 over 14 days · crossed the 60 critical line 2 days ago</div>
    </div>
    <div class="mstat">
      <div class="ms warn"><div class="n">3</div><div class="l">Duplicates</div></div>
      <div class="ms crit"><div class="n">2</div><div class="l">Contradictions</div></div>
      <div class="ms warn"><div class="n">5</div><div class="l">Stale entries</div></div>
    </div>
    <div class="sec-h">Archive suggestions <span class="hint">garden recommends</span></div>
    <div class="arch"><span class="ix">#1</span><span class="desc">Contradiction — <b>model identity</b>: claims GPT-4 (line 142) and Claude (line 31)</span><button class="btn">Resolve</button></div>
    <div class="arch"><span class="ix">#2</span><span class="desc">Duplicate — <b>retry policy</b> defined twice with different values</span><button class="btn">Archive</button></div>
    <div class="arch"><span class="ix">#3</span><span class="desc">Stale — <b>deploy note</b> from 47 days ago, never referenced since</span><button class="btn">Archive</button></div>`;},
  empty(){return stateEmpty('Garden never scanned','raven has no clawforge_garden rows — memory hygiene has not been checked yet.','observeco garden scan raven');},
};

const TABS={health:HEALTH,guard:GUARD,errors:ERRORS,tokens:TOKENS,memory:MEMORY};
let curTab='health',curState='data';

function stateEmpty(h,p,cmd){return `<div class="state-msg"><div class="ico">∅</div><h3>${h}</h3><p>${p}</p>${cmd?`<span class="cmd">${cmd}</span>`:''}</div>`;}
function stateLoading(){
  return `<div class="so" style="background:var(--surface);border-color:var(--border-soft)"><span class="mk skel" style="width:16px;height:16px"></span><div class="body" style="flex:1"><span class="skel" style="display:block;width:90px;height:9px;margin-bottom:6px"></span><span class="skel" style="display:block;width:100%;height:13px"></span></div></div>
    <div class="skel" style="width:140px;height:11px;margin:18px 0 12px"></div>
    <div class="skel" style="width:100%;height:64px;margin-bottom:14px"></div>
    <div class="skel" style="width:100%;height:120px"></div>`;
}
function stateError(){
  return `<div class="state-msg err"><div class="ico">⚠</div><h3>Couldn't load this tab</h3><p>The watch daemon stopped responding at <span class="mono" style="color:var(--fg)">02:11</span>. This view needs a live query and is showing nothing rather than stale numbers you might trust by mistake.</p><span class="cmd">observeco start</span></div>`;
}

function render(){
  const body=document.getElementById('mbody');const def=TABS[curTab];
  if(curState==='loading')body.innerHTML=stateLoading();
  else if(curState==='error')body.innerHTML=stateError();
  else if(curState==='empty')body.innerHTML=def.empty?def.empty():stateEmpty('Nothing here','No data for this tab in the selected range.','');
  else body.innerHTML=def.data();
  if(curTab==='tokens'&&curState==='data')wireTokens();
}
function wireTokens(){
  const COMP={before:[{k:'Identity',c:'bi',v:31},{k:'Skills',c:'bs',v:18},{k:'Memory',c:'bm',v:28},{k:'Tools',c:'bt',v:14},{k:'Guidance',c:'bg',v:9}],
               after:[{k:'Identity',c:'bi',v:31},{k:'Skills',c:'bs',v:12},{k:'Memory',c:'bm',v:18},{k:'Tools',c:'bt',v:14},{k:'Guidance',c:'bg',v:9}]};
  const tot={before:100,after:84};
  function draw(mode){
    const total=COMP[mode].reduce((a,b)=>a+b.v,0);
    document.getElementById('compbar').innerHTML=COMP[mode].map(c=>`<div class="cb"><span class="lab">${c.k}</span><div class="track"><i class="${c.c}" style="width:${(c.v/total*100).toFixed(0)}%"></i></div><span class="val">${(c.v/100*38214).toFixed(0)} tok · ${(c.v/total*100).toFixed(0)}%</span></div>`).join('');
    document.getElementById('compNote').textContent=mode==='after'?'38.2K → 32.1K · saves ~6.1K tok (16%)':'38,214 tokens total';
  }
  draw('before');
  document.querySelectorAll('#compSeg button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#compSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');draw(b.dataset.c);}));
}
document.getElementById('mtabs').addEventListener('click',e=>{const t=e.target.closest('.m-tab');if(!t)return;document.querySelectorAll('.m-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');curTab=t.dataset.tab;render();});
document.getElementById('stateSwitch').addEventListener('click',e=>{if(!e.target.dataset.state)return;document.querySelectorAll('#stateSwitch button').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');curState=e.target.dataset.state;render();});
render();
</script>
</body>
</html>
