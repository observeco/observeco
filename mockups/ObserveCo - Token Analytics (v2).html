<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ObserveCo — Analyze · Tokens (v2 Strong-Fit)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0f172a; --surface:#1e293b; --surface-hover:#253349; --surface-active:#334155;
  --border:#334155; --border-soft:#273548;
  --status-healthy:#22c55e; --status-warning:#eab308; --status-critical:#ef4444; --status-info:#3b82f6;
  --token-identity:#6366f1; --token-skills:#8b5cf6; --token-memory:#ec4899; --token-tools:#14b8a6; --token-guidance:#f97316;
  --fg:#f8fafc; --fg-2:#94a3b8; --fg-3:#64748b;
  --accent:#22c55e; --accent-on:#0c1628; --warn:#eab308; --danger:#ef4444; --meta:#3b82f6;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --text-xs:11px; --text-sm:12px; --text-base:14px; --text-lg:18px; --text-xl:24px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
  --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-pill:9999px;
  --ease:cubic-bezier(0.2,0,0,1); --fast:100ms; --base:150ms;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:var(--text-base);line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:var(--space-8)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent);border-radius:var(--radius-sm)}

/* topbar + nav (mirrors v2) */
.topbar{display:flex;align-items:center;gap:var(--space-3);height:48px;padding:0 var(--space-6);background:#0c1322;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:9px}.logo-word{font-weight:700;font-size:14px}.logo-word b{color:#fff}
.ver{font-family:var(--font-mono);font-size:9px;color:var(--fg-3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1px 4px}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.state-switch{display:flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.state-switch button{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-3);padding:6px 10px;transition:all var(--fast)}
.state-switch button.on{background:var(--surface-active);color:var(--fg)}
.nav{display:flex;align-items:stretch;height:42px;padding:0 var(--space-6);background:#0a101e;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav-group{display:flex;align-items:center;gap:var(--space-2);padding-right:var(--space-4);margin-right:var(--space-4);border-right:1px solid var(--border-soft)}.nav-group:last-child{border-right:none}
.nav-group .glabel{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-3)}
.nav-tab{font-size:var(--text-sm);font-weight:500;color:var(--fg-3);padding:5px 10px;border-radius:var(--radius-sm);white-space:nowrap;position:relative;cursor:default}
.nav-tab.active{color:var(--fg);background:var(--surface-active);font-weight:600}
.nav-tab.active::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}

.wrap{padding:var(--space-4) var(--space-6)}
.page-title{display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-4)}
.page-title h1{font-size:var(--text-lg);font-weight:700;letter-spacing:-0.01em}
.page-title .sub{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-3)}
.page-title .range{margin-left:auto;display:flex;gap:4px}
.rbtn{font-size:var(--text-xs);font-weight:500;color:var(--fg-2);padding:5px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}
.rbtn.on{background:var(--surface-active);color:var(--fg);border-color:var(--surface-active)}

/* so-what */
.so{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-soft);position:relative;margin-bottom:var(--space-4)}
.so::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.so .mk{flex-shrink:0;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.so .lead{font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:3px}
.so .txt{color:var(--fg);line-height:1.5}.so .txt .num{font-family:var(--font-mono);font-weight:600}
.so.insight{background:rgba(34,197,94,.06)}.so.insight::before{background:var(--accent)}.so.insight .mk{background:rgba(34,197,94,.16);color:var(--accent)}.so.insight .lead{color:var(--accent)}

.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:var(--space-4);align-items:start;margin-bottom:var(--space-4)}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--space-4)}
.panel-h{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)}
.panel-h h2{font-size:var(--text-sm);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.panel-h .meta{margin-left:auto;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-3)}
.chart-box{position:relative;height:240px}
.legend-row{display:flex;flex-wrap:wrap;gap:var(--space-3);margin-top:var(--space-3)}
.legend-row span{display:flex;align-items:center;gap:6px;font-size:var(--text-xs);color:var(--fg-2)}.legend-row i{width:12px;height:3px;border-radius:2px}

/* attribution */
.attr-ring{display:flex;align-items:center;gap:var(--space-4)}
.attr-num{font-family:var(--font-mono);font-size:40px;font-weight:700;color:var(--accent);line-height:1}
.attr-bar{height:14px;border-radius:3px;background:var(--bg);overflow:hidden;display:flex;margin:var(--space-3) 0 6px}
.attr-bar i{height:100%}.attr-bar .att{background:var(--accent)}.attr-bar .un{background:var(--surface-active)}
.attr-leg{display:flex;justify-content:space-between;font-size:var(--text-xs);color:var(--fg-2)}
.attr-leg .mono{color:var(--fg)}

/* tables */
.section-h{display:flex;align-items:center;gap:var(--space-3);margin:var(--space-6) 0 var(--space-3)}
.section-h h2{font-size:var(--text-sm);font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-2)}
.section-h .count{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-3)}
.tblwrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
.tbl th{text-align:left;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);padding:9px 14px;border-bottom:1px solid var(--border);background:#0c1322}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border-soft)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--surface-hover)}
.tbl .ag{font-family:var(--font-mono);font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.dot.healthy{background:var(--status-healthy)}.dot.warning{background:var(--status-warning)}.dot.critical{background:var(--status-critical)}
.mono{font-family:var(--font-mono)}
.cache-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.cache-mini{width:54px;height:8px;border-radius:3px;background:var(--bg);overflow:hidden;display:flex;flex-shrink:0}
.cache-mini i{height:100%}.cache-mini .read{background:var(--accent)}.cache-mini .create{background:var(--surface-active)}
.dq{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-radius:var(--radius-sm);padding:2px 6px}
.dq.acc{color:var(--accent);background:rgba(34,197,94,.1)}.dq.est{color:var(--warn);background:rgba(234,179,8,.1)}

/* per-agent composition + cache split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
@media(max-width:980px){.split{grid-template-columns:1fr}}
.comp-row{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;margin-bottom:9px}
.comp-row .ag{font-family:var(--font-mono);font-size:var(--text-sm);font-weight:600}
.comp-stack{height:16px;border-radius:3px;overflow:hidden;display:flex;background:var(--bg)}
.comp-stack i{height:100%}
.ci{background:var(--token-identity)}.cs{background:var(--token-skills)}.cm{background:var(--token-memory)}.ct{background:var(--token-tools)}.cg{background:var(--token-guidance)}
.tokleg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:var(--space-3)}
.tokleg span{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--fg-2)}.tokleg i{width:9px;height:9px;border-radius:2px}
.cache-row{display:grid;grid-template-columns:72px 1fr 46px;gap:10px;align-items:center;margin-bottom:9px}
.cache-row .ag{font-family:var(--font-mono);font-size:var(--text-sm);font-weight:600}
.cache-track{height:16px;border-radius:3px;overflow:hidden;display:flex;background:var(--bg)}
.cache-track i{height:100%}.cache-track .read{background:var(--accent)}.cache-track .create{background:var(--surface-active)}
.cache-row .pct{font-family:var(--font-mono);font-size:var(--text-xs);text-align:right}

/* states */
.skel{background:linear-gradient(90deg,var(--surface-active) 25%,var(--surface-hover) 50%,var(--surface-active) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--radius-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.state-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--space-3);padding:var(--space-8);min-height:280px}
.state-msg .ico{width:48px;height:48px;border-radius:var(--radius-md);display:grid;place-items:center;font-size:22px;background:var(--surface);border:1px solid var(--border);color:var(--fg-3)}
.state-msg.err .ico{background:rgba(234,179,8,.1);border-color:rgba(234,179,8,.3);color:var(--status-warning)}
.state-msg h3{font-size:var(--text-lg);font-weight:600}.state-msg p{color:var(--fg-2);max-width:440px;font-size:var(--text-sm)}
.cmd{font-family:var(--font-mono);font-size:var(--text-sm);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--accent)}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><svg width="20" height="20" viewBox="0 0 26 26" fill="none"><polyline points="2,15 7,15 9.5,6 13.5,21 16,15 24,15" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="7.5" r="2.4" fill="#22c55e"/></svg><span class="logo-word"><b>Observe</b>Co</span><span class="ver">0.3.0</span></div>
  <div class="right"><span style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3)">state</span>
    <div class="state-switch" id="stateSwitch"><button data-state="data" class="on">Data</button><button data-state="loading">Loading</button><button data-state="empty">Empty</button><button data-state="error">Error</button></div>
  </div>
</header>
<nav class="nav">
  <div class="nav-group"><span class="glabel">Monitor</span><span class="nav-tab">Fleet</span><span class="nav-tab">Alerts</span><span class="nav-tab">Errors</span></div>
  <div class="nav-group"><span class="glabel">Analyze</span><span class="nav-tab active">Tokens</span><span class="nav-tab">Brain</span><span class="nav-tab">Drift</span><span class="nav-tab">Compare</span></div>
  <div class="nav-group"><span class="glabel">Intelligence</span><span class="nav-tab">Anomalies</span><span class="nav-tab">Health Score</span></div>
  <div class="nav-group"><span class="glabel">Settings</span><span class="nav-tab">Config</span></div>
</nav>

<div class="wrap" id="wrap">
  <div class="page-title">
    <h1>Token Analytics</h1><span class="sub">12 agents · 215,238 calls indexed</span>
    <div class="range"><button class="rbtn">24h</button><button class="rbtn on">7d</button><button class="rbtn">30d</button></div>
  </div>
  <div id="content"></div>
</div>

<script>
/* ── mock fleet token data (schema per DPA) ── */
const AGENTS=[
  {name:'atlas',  status:'healthy', c24:5.12, c7:34.80, model:'claude-opus-4',   prov:'anthropic', cacheRead:7100, cacheCreate:2400, dq:'acc', comp:[20,28,24,18,10]},
  {name:'magnus', status:'healthy', c24:4.20, c7:28.10, model:'claude-opus-4',   prov:'anthropic', cacheRead:5200, cacheCreate:3100, dq:'acc', comp:[18,30,26,16,10]},
  {name:'kepler', status:'healthy', c24:3.47, c7:22.40, model:'gpt-4o',          prov:'openai',    cacheRead:8800, cacheCreate:1200, dq:'acc', comp:[26,24,22,16,12]},
  {name:'sable',  status:'healthy', c24:2.83, c7:18.90, model:'claude-sonnet-4', prov:'anthropic', cacheRead:4100, cacheCreate:2600, dq:'acc', comp:[24,26,22,16,12]},
  {name:'dreamer',status:'warning', c24:1.92, c7:14.20, model:'claude-sonnet-4', prov:'anthropic', cacheRead:900,  cacheCreate:4200, dq:'est', comp:[22,30,26,12,10]},
  {name:'echo',   status:'healthy', c24:1.65, c7:11.30, model:'gpt-4o',          prov:'openai',    cacheRead:3400, cacheCreate:1500, dq:'acc', comp:[26,24,22,16,12]},
  {name:'orion',  status:'healthy', c24:1.08, c7:7.60,  model:'gpt-4o-mini',     prov:'openai',    cacheRead:2200, cacheCreate:1100, dq:'acc', comp:[30,22,20,16,12]},
  {name:'quill',  status:'healthy', c24:0.94, c7:6.10,  model:'deepseek-chat',   prov:'deepseek',  cacheRead:1800, cacheCreate:900,  dq:'est', comp:[28,22,24,14,12]},
  {name:'hound',  status:'healthy', c24:0.71, c7:4.90,  model:'deepseek-chat',   prov:'deepseek',  cacheRead:2600, cacheCreate:600,  dq:'acc', comp:[28,20,24,18,10]},
  {name:'vesper', status:'healthy', c24:0.00, c7:0.00,  model:'llama3.3-70b',    prov:'ollama',    cacheRead:0,    cacheCreate:0,    dq:'acc', comp:[34,18,22,16,10]},
  {name:'juno',   status:'healthy', c24:0.00, c7:0.00,  model:'qwen2.5-32b',     prov:'ollama',    cacheRead:0,    cacheCreate:0,    dq:'acc', comp:[36,16,22,16,10]},
  {name:'raven',  status:'critical',c24:0.00, c7:8.40,  model:'claude-sonnet-4', prov:'anthropic', cacheRead:0,    cacheCreate:0,    dq:'est', comp:[31,18,28,14,9]},
];
const cacheRate=a=>{const t=a.cacheRead+a.cacheCreate;return t?Math.round(a.cacheRead/t*100):null;};
const total24=AGENTS.reduce((s,a)=>s+a.c24,0);

function soWhat(){
  const top3=[...AGENTS].sort((a,b)=>b.c24-a.c24).slice(0,3);
  const top3pct=Math.round(top3.reduce((s,a)=>s+a.c24,0)/total24*100);
  return `<div class="so insight"><span class="mk">✦</span><div class="body"><span class="lead">Token spend · so what</span><span class="txt"><b class="num">${top3pct}%</b> of today's <b class="num">$${total24.toFixed(2)}</b> is just <b>atlas, magnus, kepler</b>. <b>kepler</b> is the efficient one — <b class="num">88%</b> cache rate at <b class="num">$3.47</b>/24h. <b>dreamer</b> is the leak: <b class="num">18%</b> cache, paying near-full generation every turn. <b>raven</b> is down — <b class="num">$0.00</b> today but still <b class="num">$8.40</b> over 7d before it died.</span></div></div>`;
}
function trendChart(){
  return `<div class="grid2">
    <div class="panel">
      <div class="panel-h"><h2>Cost trend</h2><span class="meta">7 days · USD/day</span></div>
      <div class="chart-box"><canvas id="costChart"></canvas></div>
      <div class="legend-row"><span><i style="background:#22c55e"></i>Total</span><span><i style="background:#6366f1"></i>Input</span><span><i style="background:#ec4899"></i>Output</span><span><i style="background:#14b8a6"></i>Cache</span></div>
    </div>
    <div class="panel">
      <div class="panel-h"><h2>Attribution gap</h2></div>
      <div class="attr-ring"><span class="attr-num">91%</span><div style="flex:1"><div style="font-size:12px;color:var(--fg-2);line-height:1.4">of spend is attributed to an agent with telemetry. The rest comes from agents without the plugin.</div></div></div>
      <div class="attr-bar"><i class="att" style="width:91%"></i><i class="un" style="width:9%"></i></div>
      <div class="attr-leg"><span class="mono">$${(total24*0.91).toFixed(2)} attributed</span><span class="mono">$${(total24*0.09).toFixed(2)} unattributed</span></div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border-soft);font-size:11px;color:var(--fg-3);line-height:1.5"><b style="color:var(--fg-2)">2 agents</b> (quill, dreamer) are watch-only — their cost is estimated from SOUL.md, not measured. Install the telemetry plugin to close the gap.</div>
    </div>
  </div>`;
}
function costTable(){
  const rows=[...AGENTS].sort((a,b)=>b.c24-a.c24).map(a=>{
    const cr=cacheRate(a);
    const crCol=cr===null?'var(--fg-3)':cr>=60?'var(--status-healthy)':cr>=30?'var(--status-warning)':'var(--status-critical)';
    return `<tr>
      <td><span class="ag"><span class="dot ${a.status}"></span>${a.name}</span></td>
      <td class="r mono">$${a.c24.toFixed(2)}</td>
      <td class="r mono" style="color:var(--fg-2)">$${a.c7.toFixed(2)}</td>
      <td class="mono" style="color:var(--fg-2)">${a.model}</td>
      <td class="mono" style="color:var(--fg-3)">${a.prov}</td>
      <td class="r"><div class="cache-cell">${cr===null?'<span class="mono" style="color:var(--fg-3)">—</span>':`<span class="cache-mini"><i class="read" style="width:${cr}%"></i><i class="create" style="width:${100-cr}%"></i></span><span class="mono" style="color:${crCol}">${cr}%</span>`}</div></td>
      <td class="r"><span class="dq ${a.dq}">${a.dq==='acc'?'✓ Acc':'⚠ Est'}</span></td>
    </tr>`;
  }).join('');
  return `<div class="section-h"><h2>Per-agent cost</h2><span class="count">12 agents · sorted by 24h spend</span></div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Agent</th><th class="r">24h</th><th class="r">7d</th><th>Model</th><th>Provider</th><th class="r">Cache rate</th><th class="r">Data</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function compositionPanel(){
  const top=[...AGENTS].filter(a=>a.c7>0).sort((a,b)=>b.c7-a.c7).slice(0,8);
  const rows=top.map(a=>{const t=a.comp.reduce((x,y)=>x+y,0);const cl=['ci','cs','cm','ct','cg'];return `<div class="comp-row"><span class="ag">${a.name}</span><div class="comp-stack">${a.comp.map((v,i)=>`<i class="${cl[i]}" style="width:${(v/t*100).toFixed(1)}%"></i>`).join('')}</div></div>`;}).join('');
  return `<div class="panel"><div class="panel-h"><h2>Spend composition</h2><span class="meta">share of tokens by component</span></div>${rows}
    <div class="tokleg"><span><i style="background:var(--token-identity)"></i>Identity</span><span><i style="background:var(--token-skills)"></i>Skills</span><span><i style="background:var(--token-memory)"></i>Memory</span><span><i style="background:var(--token-tools)"></i>Tools</span><span><i style="background:var(--token-guidance)"></i>Guidance</span></div></div>`;
}
function cachePanel(){
  const top=[...AGENTS].filter(a=>a.cacheRead+a.cacheCreate>0).sort((a,b)=>cacheRate(b)-cacheRate(a));
  const rows=top.map(a=>{const cr=cacheRate(a);return `<div class="cache-row"><span class="ag">${a.name}</span><div class="cache-track"><i class="read" style="width:${cr}%"></i><i class="create" style="width:${100-cr}%"></i></div><span class="pct" style="color:${cr>=60?'var(--status-healthy)':cr>=30?'var(--status-warning)':'var(--status-critical)'}">${cr}%</span></div>`;}).join('');
  return `<div class="panel"><div class="panel-h"><h2>Cache efficiency</h2><span class="meta">read vs create</span></div>${rows}
    <div class="tokleg"><span><i style="background:var(--accent)"></i>Cache read (cheap)</span><span><i style="background:var(--surface-active)"></i>Cache create (full price)</span></div>
    <div style="margin-top:12px;font-size:11px;color:var(--fg-3);line-height:1.5">dreamer at <b style="color:var(--status-critical)">18%</b> is paying near-full generation every turn — check whether prompt caching is enabled in its provider config.</div></div>`;
}
function renderData(){
  document.getElementById('content').innerHTML=soWhat()+trendChart()+
    `<div class="section-h"><h2>Composition & cache</h2><span class="count">ObserveCo-only views</span></div><div class="split">${compositionPanel()}${cachePanel()}</div>`+
    costTable();
  drawCostChart();
}
let chartInstance=null;
function drawCostChart(){
  const ctx=document.getElementById('costChart');if(!ctx||!window.Chart)return;
  const labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const mk=(base)=>labels.map((_,i)=>+(base*(0.8+Math.sin(i/1.5)*0.18+i*0.04)).toFixed(2));
  const total=mk(24),input=total.map(v=>+(v*0.42).toFixed(2)),output=total.map(v=>+(v*0.31).toFixed(2)),cache=total.map(v=>+(v*0.27).toFixed(2));
  const g=document.documentElement;const f=v=>getComputedStyle(g).getPropertyValue(v).trim();
  chartInstance=new Chart(ctx,{type:'line',data:{labels,datasets:[
    {label:'Total',data:total,borderColor:'#22c55e',backgroundColor:'rgba(34,197,94,.08)',fill:true,tension:.35,borderWidth:2,pointRadius:0,pointHoverRadius:4},
    {label:'Input',data:input,borderColor:'#6366f1',tension:.35,borderWidth:1.5,pointRadius:0,pointHoverRadius:4},
    {label:'Output',data:output,borderColor:'#ec4899',tension:.35,borderWidth:1.5,pointRadius:0,pointHoverRadius:4},
    {label:'Cache',data:cache,borderColor:'#14b8a6',tension:.35,borderWidth:1.5,pointRadius:0,pointHoverRadius:4},
  ]},options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false},tooltip:{backgroundColor:'#1e293b',borderColor:'#334155',borderWidth:1,titleFont:{family:"'JetBrains Mono'"},bodyFont:{family:"'JetBrains Mono'"},callbacks:{label:c=>` ${c.dataset.label}: $${c.parsed.y.toFixed(2)}`}}},
    scales:{x:{grid:{color:'#273548'},ticks:{color:'#64748b',font:{family:"'JetBrains Mono'",size:10}}},
            y:{grid:{color:'#273548'},ticks:{color:'#64748b',font:{family:"'JetBrains Mono'",size:10},callback:v=>'$'+v}}}}});
}
function renderLoading(){
  document.getElementById('content').innerHTML=
    `<div class="skel" style="height:58px;margin-bottom:16px"></div>
     <div class="grid2"><div class="panel"><div class="skel" style="width:120px;height:13px;margin-bottom:14px"></div><div class="skel" style="height:240px"></div></div><div class="panel"><div class="skel" style="width:120px;height:13px;margin-bottom:14px"></div><div class="skel" style="height:200px"></div></div></div>
     <div class="skel" style="width:160px;height:13px;margin:24px 0 12px"></div>
     <div class="tblwrap" style="padding:0">${Array.from({length:6}).map(()=>'<div class="skel" style="height:40px;margin:1px"></div>').join('')}</div>`;
}
function renderEmpty(){
  document.getElementById('content').innerHTML=`<div class="state-msg"><div class="ico">$</div><h3>No token data yet</h3><p>No <span class="mono" style="color:var(--fg)">token_logs</span> rows in the selected range. Once your agents make LLM calls with the telemetry plugin installed, cost and composition appear here.</p><span class="cmd">observeco plugin install hermes-telemetry</span></div>`;
}
function renderError(){
  document.getElementById('content').innerHTML=`<div class="state-msg err"><div class="ico">⚠</div><h3>Analytics query failed</h3><p>The watch daemon stopped responding at <span class="mono" style="color:var(--fg)">02:11</span>. Cost figures would be stale and misleading, so they're hidden rather than shown wrong.</p><span class="cmd">observeco start</span></div>`;
}
function render(s){
  document.querySelectorAll('#stateSwitch button').forEach(b=>b.classList.toggle('on',b.dataset.state===s));
  if(chartInstance){chartInstance.destroy();chartInstance=null;}
  ({data:renderData,loading:renderLoading,empty:renderEmpty,error:renderError}[s])();
}
document.getElementById('stateSwitch').addEventListener('click',e=>{if(e.target.dataset.state)render(e.target.dataset.state)});
render('data');
</script>
</body>
</html>
