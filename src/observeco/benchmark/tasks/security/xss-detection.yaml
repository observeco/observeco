# XSS Detection Benchmark
#
# Evaluates whether the agent can identify Cross-Site Scripting (XSS)
# vulnerabilities in web application code.

task: xss_detection
dataset_path: json
dataset_kwargs:
  data_files:
    test: ./data/xss_tasks.json
description: "Identify XSS vulnerabilities in the given code snippet."
doc_to_text: |
  Review the following code and identify any XSS vulnerabilities.
  Explain where the vulnerability is and how to fix it.

  ```javascript
  {{code}}
  ```

  Your analysis:
doc_to_target: "{{expected}}"
output_type: generate_until
test_split: test
generation_kwargs:
  until: []
  max_gen_toks: 512
  do_sample: false
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: "1.0"
  category: security
  difficulty: medium
