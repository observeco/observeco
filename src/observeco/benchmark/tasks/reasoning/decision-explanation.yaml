# Decision Explanation Benchmark
#
# Evaluates whether the agent can explain the reasoning behind
# a technical or architectural decision.

task: decision_explanation
dataset_path: json
dataset_kwargs:
  data_files:
    test: ./data/decision_explanation_tasks.json
description: "Explain the reasoning behind the given technical decision."
doc_to_text: |
  A team made the following decision. Explain the reasoning behind it.

  Decision: {{decision}}

  Context: {{context}}

  Reasoning:
doc_to_target: "{{expected}}"
output_type: generate_until
test_split: test
generation_kwargs:
  until: []
  max_gen_toks: 512
  do_sample: false
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: "1.0"
  category: reasoning
  difficulty: medium
