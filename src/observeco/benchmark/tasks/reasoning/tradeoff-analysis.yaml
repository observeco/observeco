# Tradeoff Analysis Benchmark
#
# Evaluates whether the agent can analyze tradeoffs between
# competing technical approaches.

task: tradeoff_analysis
dataset_path: json
dataset_kwargs:
  data_files:
    test: ./data/tradeoff_analysis_tasks.json
description: "Analyze the tradeoffs between two approaches."
doc_to_text: |
  Compare the following two approaches and analyze the tradeoffs:

  Approach A: {{approach_a}}

  Approach B: {{approach_b}}

  Context: {{context}}

  Analysis:
doc_to_target: "{{expected}}"
output_type: generate_until
test_split: test
generation_kwargs:
  until: []
  max_gen_toks: 512
  do_sample: false
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: "1.0"
  category: reasoning
  difficulty: medium
