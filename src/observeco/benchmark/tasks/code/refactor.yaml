# Refactoring Benchmark
#
# Evaluates whether the agent can refactor code to be cleaner,
# more efficient, or more readable.

task: refactor
dataset_path: json
dataset_kwargs:
  data_files:
    test: ./data/refactor_tasks.json
description: "Refactor the given code to improve readability and efficiency."
doc_to_text: |
  Refactor the following code to improve readability and maintainability
  while preserving the original behavior.

  ```python
  {{code}}
  ```

  Refactored code:
doc_to_target: "{{expected}}"
output_type: generate_until
test_split: test
generation_kwargs:
  until: []
  max_gen_toks: 512
  do_sample: false
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: "1.0"
  category: code
  difficulty: easy
