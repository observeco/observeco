<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ObserveCo — Agent Dashboard</title>
    <script src="https://unpkg.com/htmx.org@1.9.11"
            integrity="sha384-0gxUXCCwxNpqC1mQW0+6VQ3qB+LQZEo/WzH6cZxN6N+zOoG4M6G6G8pCQ+Z+O0/"
            crossorigin="anonymous"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1e293b;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #f8fafc;
        }
        .header h1 span { color: #38bdf8; }
        .header-subtitle {
            font-size: 13px;
            color: #64748b;
        }

        /* Fleet Stats */
        .fleet-stats {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-box {
            padding: 12px 20px;
            border-radius: 8px;
            background: #1e293b;
            border: 1px solid #334155;
            font-size: 14px;
        }
        .stat-num { font-size: 28px; font-weight: 700; display: block; }
        .stat-box.total .stat-num { color: #38bdf8; }
        .stat-box.alive .stat-num { color: #22c55e; }
        .stat-box.dead .stat-num { color: #ef4444; }
        .stat-box.error .stat-num { color: #f59e0b; }

        /* Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .full-width { grid-column: 1 / -1; }

        /* Panels */
        .panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
        }
        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        /* Agent Cards */
        .agent-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .agent-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            position: relative;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .agent-name {
            font-weight: 600;
            font-size: 14px;
        }
        .agent-framework {
            font-size: 11px;
            color: #64748b;
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .card-body .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 2px 0;
        }
        .metric-label { color: #64748b; }
        .status-alive { color: #22c55e; }
        .status-dead { color: #ef4444; }
        .status-error { color: #f59e0b; }

        /* Token Bars */
        .token-bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .bar-label { width: 100px; color: #94a3b8; flex-shrink: 0; }
        .token-bar {
            flex: 1;
            height: 16px;
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
        }
        .token-segment { height: 100%; }
        .seg-identity { background: #3b82f6; }
        .seg-skills { background: #8b5cf6; }
        .seg-memory { background: #22c55e; }
        .seg-tools { background: #f59e0b; }
        .seg-guidance { background: #ef4444; }
        .bar-total { width: 60px; text-align: right; color: #64748b; flex-shrink: 0; }

        /* Error Timeline */
        .error-item {
            display: flex;
            gap: 12px;
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid #1e293b;
        }
        .error-ts { color: #64748b; width: 80px; }
        .error-agent { color: #38bdf8; width: 100px; }
        .error-msg { flex: 1; }

        /* Empty State */
        .empty-state {
            color: #64748b;
            font-size: 13px;
            padding: 20px;
            text-align: center;
        }
        .empty-state code {
            background: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }

        /* Drift & Garden */
        .drift-item, .garden-item {
            display: flex;
            gap: 12px;
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid #1e293b;
        }
        .drift-agent, .garden-agent { color: #38bdf8; width: 100px; }
        .drift-comp { color: #94a3b8; }
        .drift-delta { color: #ef4444; }
        .garden-debt { color: #f59e0b; }
        .garden-grade { color: #94a3b8; }
        .garden-details { color: #64748b; }

        /* Loading */
        .htmx-indicator { opacity: 0; transition: opacity 0.3s; }
        .htmx-request .htmx-indicator { opacity: 1; }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: flex-start; gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><span>Observe</span>Co</h1>
                <div class="header-subtitle">Agent Runtime Observability</div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <span class="header-subtitle">Auto-refresh every 30s</span>
            </div>
        </div>

        <!-- Fleet Summary -->
        <div id="fleet-summary"
             hx-get="/api/fleet-summary"
             hx-trigger="load, every 30s"
             hx-swap="innerHTML">
            <div class="empty-state">Loading fleet...</div>
        </div>

        <div class="dashboard-grid">
            <!-- Agent Cards -->
            <div class="panel">
                <div class="panel-title">Agent Fleet</div>
                <div id="agent-cards"
                     class="agent-cards"
                     hx-get="/api/agents"
                     hx-trigger="load, every 30s"
                     hx-swap="innerHTML">
                    <div class="empty-state">Loading agents...</div>
                </div>
            </div>

            <!-- Token Summary -->
            <div class="panel">
                <div class="panel-title">Token Profile</div>
                <div id="token-summary"
                     hx-get="/api/token-summary"
                     hx-trigger="load, every 30s"
                     hx-swap="innerHTML">
                    <div class="empty-state">Loading token data...</div>
                </div>
            </div>

            <!-- Drift Summary -->
            <div class="panel">
                <div class="panel-title">Drift Breaches</div>
                <div id="drift-summary"
                     hx-get="/api/drift-summary"
                     hx-trigger="load, every 30s"
                     hx-swap="innerHTML">
                    <div class="empty-state">Loading drift data...</div>
                </div>
            </div>

            <!-- Memory Garden -->
            <div class="panel">
                <div class="panel-title">Memory Health</div>
                <div id="garden-summary"
                     hx-get="/api/garden-summary"
                     hx-trigger="load, every 30s"
                     hx-swap="innerHTML">
                    <div class="empty-state">Loading memory data...</div>
                </div>
            </div>
        </div>

        <!-- Error Timeline -->
        <div class="panel full-width">
            <div class="panel-title">Error Timeline</div>
            <div id="error-timeline"
                 hx-get="/api/errors"
                 hx-trigger="load, every 30s"
                 hx-swap="innerHTML">
                <div class="empty-state">Loading errors...</div>
            </div>
        </div>
    </div>
</body>
</html>
