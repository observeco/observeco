document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"e4ddb1de-5bde-43fb-9c4c-754d88430c84\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  html, body { margin:0; padding:0; background:#f7f6f3; }\n  * { box-sizing:border-box; }\n  a { color:#0e6e5c; text-decoration:none; border-bottom:1px solid #c6dcd4; }\n  a:hover { color:#0a5447; border-bottom-color:#0a5447; }\n  button { font:inherit; }\n  @keyframes riseA { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }\n  @keyframes riseB { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }\n  @keyframes slipA { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }\n  @keyframes slipB { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }\n  @keyframes advance { 0% { opacity:.2; transform:translateX(-7px); } 45% { opacity:1; transform:translateX(0); } 100% { opacity:.2; transform:translateX(7px); } }\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after { animation:none !important; transition-duration:0.01ms !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#f7f6f3; color:#1b1f24; font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing:antialiased; padding:56px 32px 72px; min-height:100vh;\">\n  <div style=\"max-width:1280px; margin:0 auto;\">\n\n    <header style=\"display:grid; grid-template-columns:{{ headerCols }}; gap:{{ headerGap }}; align-items:end; padding-bottom:28px; border-bottom:1px solid #e4e2dc;\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#0e6e5c; margin-bottom:18px;\">Positioning &amp; marketing warfare · after Al Ries and Jack Trout<\u002Fdiv>\n        <h1 style=\"font-family:'Iowan Old Style', Georgia, 'Times New Roman', serif; font-weight:400; font-size:{{ titleSize }}; line-height:1.05; letter-spacing:-0.015em; margin:0 0 14px; text-wrap:pretty;\">The flank, not<br>the frontal.<\u002Fh1>\n        <p style=\"margin:0; font-size:16px; line-height:1.6; color:#4a525c; max-width:50ch; text-wrap:pretty;\">A small company that fights a big one head-on loses. This is the alternative, step by step: pick one group nobody serves properly, find the single true fact that explains why they are underserved, and grow only as far as that fact carries you. No prior knowledge assumed.<\u002Fp>\n      <\u002Fdiv>\n      <dl style=\"margin:0; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:20px; border-left:{{ dlBorder }}; padding-left:{{ dlPad }};\">\n        <div>\n          <dt style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#6b737e; margin-bottom:8px;\">Act I<\u002Fdt>\n          <dd style=\"margin:0; font-family:'Iowan Old Style', Georgia, serif; font-size:19px; line-height:1.25;\">The beachhead<\u002Fdd>\n        <\u002Fdiv>\n        <div>\n          <dt style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#6b737e; margin-bottom:8px;\">Act II<\u002Fdt>\n          <dd style=\"margin:0; font-family:'Iowan Old Style', Georgia, serif; font-size:19px; line-height:1.25;\">The wedge<\u002Fdd>\n        <\u002Fdiv>\n        <div>\n          <dt style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#6b737e; margin-bottom:8px;\">Act III<\u002Fdt>\n          <dd style=\"margin:0; font-family:'Iowan Old Style', Georgia, serif; font-size:19px; line-height:1.25;\">The expansion<\u002Fdd>\n        <\u002Fdiv>\n      <\u002Fdl>\n    <\u002Fheader>\n\n    <section aria-label=\"Four words to know first\" style=\"margin-top:28px; display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:1px; background:#e4e2dc; border:1px solid #e4e2dc; border-radius:10px; overflow:hidden;\">\n      <div style=\"background:#ffffff; padding:16px 18px;\">\n        <div style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#0e6e5c; margin-bottom:6px;\">Position<\u002Fdiv>\n        <p style=\"margin:0; font-size:14px; line-height:1.55; color:#4a525c;\">The one thing people already believe you are for.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#ffffff; padding:16px 18px;\">\n        <div style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#0e6e5c; margin-bottom:6px;\">The ladder<\u002Fdiv>\n        <p style=\"margin:0; font-size:14px; line-height:1.55; color:#4a525c;\">The short mental list of who is best at something. The big company is on the top rung.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#ffffff; padding:16px 18px;\">\n        <div style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#0e6e5c; margin-bottom:6px;\">Flank<\u002Fdiv>\n        <p style=\"margin:0; font-size:14px; line-height:1.55; color:#4a525c;\">Moving onto ground nobody is defending, instead of a fight you would lose.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#ffffff; padding:16px 18px;\">\n        <div style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#0e6e5c; margin-bottom:6px;\">Beachhead<\u002Fdiv>\n        <p style=\"margin:0; font-size:14px; line-height:1.55; color:#4a525c;\">The first small patch of ground you take, and hold, before anything else.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div style=\"display:grid; grid-template-columns:{{ mainCols }}; gap:40px; margin-top:32px; align-items:start;\">\n\n      <section style=\"min-width:0;\">\n        <figure style=\"margin:0; background:#ffffff; border:1px solid #e4e2dc; border-radius:14px; box-shadow:0 1px 2px rgba(27,31,36,.04); overflow:hidden;\">\n          <figcaption style=\"display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; justify-content:space-between; padding:16px 20px; border-bottom:1px solid #e4e2dc;\">\n            <span style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#6b737e;\">Terrain of the mind · relief model, abstract<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#0e6e5c;\">{{ stepTag }}<\u002Fspan>\n          <\u002Ffigcaption>\n\n          <svg sc-camel-view-box=\"0 100 1200 664\" role=\"img\" aria-label=\"Three-dimensional relief map: the incumbent's massif, four market segments, and the captured territory\" style=\"display:block; width:100%; height:auto; background:#f7f6f3;\">\n            {{ terrain }}\n            <g font-family=\"'JetBrains Mono', ui-monospace, Menlo, monospace\" font-size=\"13\" letter-spacing=\"1.2\" stroke=\"#f7f6f3\" stroke-width=\"4\" stroke-linejoin=\"round\" style=\"paint-order:stroke fill;\">\n              <text x=\"{{ labIncX }}\" y=\"{{ labIncY }}\" font-family=\"'Iowan Old Style', Georgia, serif\" font-size=\"27\" letter-spacing=\"0.5\" fill=\"#2c5580\" text-anchor=\"middle\">The incumbent<\u002Ftext>\n              <text x=\"{{ labIncX }}\" y=\"{{ labIncY2 }}\" fill=\"#3d6b9b\" text-anchor=\"middle\" font-size=\"11\">HOLDS THE TOP RUNG<\u002Ftext>\n              <text x=\"{{ labCX }}\" y=\"{{ labCY }}\" fill=\"#a4716f\" text-anchor=\"middle\">SEGMENT C<\u002Ftext>\n              <text x=\"{{ labBX }}\" y=\"{{ labBY }}\" fill=\"#7f8c5a\" text-anchor=\"middle\">SEGMENT B<\u002Ftext>\n              <text x=\"{{ labBX }}\" y=\"{{ labBY2 }}\" fill=\"#6b737e\" font-family=\"Inter, system-ui, sans-serif\" font-size=\"12\" letter-spacing=\"0\" text-anchor=\"middle\">adjacent territory<\u002Ftext>\n              <text x=\"{{ labDX }}\" y=\"{{ labDY }}\" fill=\"#6e8b9e\" text-anchor=\"middle\">SEGMENT D<\u002Ftext>\n              <text x=\"{{ labAX }}\" y=\"{{ labAY }}\" fill=\"#a4552a\" text-anchor=\"middle\">SEGMENT A<\u002Ftext>\n              <text x=\"{{ labAX }}\" y=\"{{ labAY2 }}\" fill=\"#6b737e\" font-family=\"Inter, system-ui, sans-serif\" font-size=\"12\" letter-spacing=\"0\" text-anchor=\"middle\">high intent · underserved · uncontested<\u002Ftext>\n            <\u002Fg>\n          <\u002Fsvg>\n\n          <div style=\"padding:20px 24px 24px; border-top:1px solid #e4e2dc;\">\n            <div style=\"display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; min-height:26px;\">\n              <span style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#0a5447; background:#e7f1ee; border:1px solid #c6dcd4; border-radius:6px; padding:5px 10px; animation:{{ animA }} .45s ease both;\">{{ chip1 }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#4a525c; background:#ffffff; border:1px solid #e4e2dc; border-radius:6px; padding:5px 10px; animation:{{ animA }} .45s ease .07s both;\">{{ chip2 }}<\u002Fspan>\n            <\u002Fdiv>\n            <div aria-live=\"polite\" style=\"min-height:224px;\">\n              <p style=\"margin:0 0 8px; font-family:'Iowan Old Style', Georgia, serif; font-size:24px; line-height:1.22; animation:{{ animB }} .5s ease .04s both;\">{{ stepTitle }}<\u002Fp>\n              <p style=\"margin:0; font-size:15px; line-height:1.65; color:#4a525c; max-width:74ch; text-wrap:pretty; animation:{{ animB }} .5s ease .12s both;\">{{ stepBody }}<\u002Fp>\n              <div style=\"margin-top:14px; border-left:2px solid #c6dcd4; padding:1px 0 1px 14px; animation:{{ animB }} .5s ease .2s both;\">\n                <div style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#0e6e5c; margin-bottom:5px;\">Worked example · an invented rain-jacket company<\u002Fdiv>\n                <p style=\"margin:0; font-size:14px; line-height:1.6; color:#4a525c; max-width:72ch; text-wrap:pretty;\">{{ stepExample }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:20px;\">\n              <button type=\"button\" sc-camel-on-click=\"{{ toggle }}\" aria-label=\"{{ playLabel }}\" style=\"min-width:112px; height:44px; padding:0 18px; border-radius:10px; border:1px solid #0a5447; background:#0e6e5c; color:#ffffff; font-size:13px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;\" style-hover=\"background:#0a5447\">{{ playLabel }}<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ prev }}\" aria-label=\"Previous step\" style=\"width:44px; height:44px; border-radius:10px; border:1px solid #e4e2dc; background:#ffffff; color:#1b1f24; cursor:pointer;\" style-hover=\"border-color:#0e6e5c; color:#0e6e5c\">←<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ next }}\" aria-label=\"Next step\" style=\"width:44px; height:44px; border-radius:10px; border:1px solid #e4e2dc; background:#ffffff; color:#1b1f24; cursor:pointer;\" style-hover=\"border-color:#0e6e5c; color:#0e6e5c\">→<\u002Fbutton>\n              <div role=\"tablist\" aria-label=\"Steps\" style=\"display:flex; gap:2px; margin-left:8px;\">\n                <button type=\"button\" role=\"tab\" sc-camel-on-click=\"{{ dot1Go }}\" aria-label=\"{{ dot1Label }}\" aria-selected=\"{{ dot1Sel }}\" style=\"width:44px; height:44px; display:grid; place-items:center; border:0; background:none; cursor:pointer; padding:0;\">\n                  <span style=\"display:block; width:100%; height:3px; border-radius:2px; transition:background .3s ease; background:{{ dot1Bg }}\"><\u002Fspan>\n                <\u002Fbutton>\n                <button type=\"button\" role=\"tab\" sc-camel-on-click=\"{{ dot2Go }}\" aria-label=\"{{ dot2Label }}\" aria-selected=\"{{ dot2Sel }}\" style=\"width:44px; height:44px; display:grid; place-items:center; border:0; background:none; cursor:pointer; padding:0;\">\n                  <span style=\"display:block; width:100%; height:3px; border-radius:2px; transition:background .3s ease; background:{{ dot2Bg }}\"><\u002Fspan>\n                <\u002Fbutton>\n                <button type=\"button\" role=\"tab\" sc-camel-on-click=\"{{ dot3Go }}\" aria-label=\"{{ dot3Label }}\" aria-selected=\"{{ dot3Sel }}\" style=\"width:44px; height:44px; display:grid; place-items:center; border:0; background:none; cursor:pointer; padding:0;\">\n                  <span style=\"display:block; width:100%; height:3px; border-radius:2px; transition:background .3s ease; background:{{ dot3Bg }}\"><\u002Fspan>\n                <\u002Fbutton>\n                <button type=\"button\" role=\"tab\" sc-camel-on-click=\"{{ dot4Go }}\" aria-label=\"{{ dot4Label }}\" aria-selected=\"{{ dot4Sel }}\" style=\"width:44px; height:44px; display:grid; place-items:center; border:0; background:none; cursor:pointer; padding:0;\">\n                  <span style=\"display:block; width:100%; height:3px; border-radius:2px; transition:background .3s ease; background:{{ dot4Bg }}\"><\u002Fspan>\n                <\u002Fbutton>\n                <button type=\"button\" role=\"tab\" sc-camel-on-click=\"{{ dot5Go }}\" aria-label=\"{{ dot5Label }}\" aria-selected=\"{{ dot5Sel }}\" style=\"width:44px; height:44px; display:grid; place-items:center; border:0; background:none; cursor:pointer; padding:0;\">\n                  <span style=\"display:block; width:100%; height:3px; border-radius:2px; transition:background .3s ease; background:{{ dot5Bg }}\"><\u002Fspan>\n                <\u002Fbutton>\n                <button type=\"button\" role=\"tab\" sc-camel-on-click=\"{{ dot6Go }}\" aria-label=\"{{ dot6Label }}\" aria-selected=\"{{ dot6Sel }}\" style=\"width:44px; height:44px; display:grid; place-items:center; border:0; background:none; cursor:pointer; padding:0;\">\n                  <span style=\"display:block; width:100%; height:3px; border-radius:2px; transition:background .3s ease; background:{{ dot6Bg }}\"><\u002Fspan>\n                <\u002Fbutton>\n                <button type=\"button\" role=\"tab\" sc-camel-on-click=\"{{ dot7Go }}\" aria-label=\"{{ dot7Label }}\" aria-selected=\"{{ dot7Sel }}\" style=\"width:44px; height:44px; display:grid; place-items:center; border:0; background:none; cursor:pointer; padding:0;\">\n                  <span style=\"display:block; width:100%; height:3px; border-radius:2px; transition:background .3s ease; background:{{ dot7Bg }}\"><\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fdiv>\n              <span style=\"margin-left:auto; font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:11px; color:#6b737e; letter-spacing:.1em;\">{{ counter }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Ffigure>\n      <\u002Fsection>\n\n      <aside style=\"min-width:0; display:flex; flex-direction:column; gap:4px;\">\n        <article style=\"padding:20px 0 22px; border-top:1px solid #e4e2dc; transition:opacity .35s ease; opacity:{{ act1Op }}\">\n          <div style=\"display:flex; align-items:baseline; gap:10px; margin-bottom:8px;\">\n            <span style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:{{ act1Tone }}\">Act I · the beachhead<\u002Fspan>\n            <span style=\"height:1px; flex:1; background:#e4e2dc;\"><\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family:'Iowan Old Style', Georgia, serif; font-weight:400; font-size:26px; line-height:1.15; margin:0 0 10px;\">Choose the ground<\u002Fh2>\n          <p style=\"margin:0 0 12px; font-size:15px; line-height:1.62; color:#4a525c; text-wrap:pretty;\">The big company holds the high ground in people's heads. You give up on taking that hill and go where nobody is standing.<\u002Fp>\n          <ul style=\"margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px;\">\n            <li style=\"display:grid; grid-template-columns:14px 1fr; gap:10px; font-size:14px; line-height:1.55; color:#4a525c;\"><span aria-hidden=\"true\" style=\"color:#0e6e5c;\">—<\u002Fspan><span>Head-on means competing on price, shelf space and advertising — where money wins.<\u002Fspan><\u002Fli>\n            <li style=\"display:grid; grid-template-columns:14px 1fr; gap:10px; font-size:14px; line-height:1.55; color:#4a525c;\"><span aria-hidden=\"true\" style=\"color:#0e6e5c;\">—<\u002Fspan><span>A real flank means nobody is already the answer for that group.<\u002Fspan><\u002Fli>\n            <li style=\"display:grid; grid-template-columns:14px 1fr; gap:10px; font-size:14px; line-height:1.55; color:#4a525c;\"><span aria-hidden=\"true\" style=\"color:#0e6e5c;\">—<\u002Fspan><span>Define the group by the moment, the missing thing, and proof they will pay.<\u002Fspan><\u002Fli>\n            <li style=\"display:grid; grid-template-columns:14px 1fr; gap:10px; font-size:14px; line-height:1.55; color:#4a525c;\"><span aria-hidden=\"true\" style=\"color:#0e6e5c;\">—<\u002Fspan><span>Then say one thing about yourself, everywhere, and drop the rest.<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Farticle>\n        <article style=\"padding:20px 0 22px; border-top:1px solid #e4e2dc; transition:opacity .35s ease; opacity:{{ act2Op }}\">\n          <div style=\"display:flex; align-items:baseline; gap:10px; margin-bottom:8px;\">\n            <span style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:{{ act2Tone }}\">Act II · the wedge<\u002Fspan>\n            <span style=\"height:1px; flex:1; background:#e4e2dc;\"><\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family:'Iowan Old Style', Georgia, serif; font-weight:400; font-size:26px; line-height:1.15; margin:0 0 10px;\">Fortify with a truth<\u002Fh2>\n          <p style=\"margin:0 0 12px; font-size:15px; line-height:1.62; color:#4a525c; text-wrap:pretty;\">The wedge is the one checkable fact that explains why the usual product is wrong for this group. It makes your claim an explanation rather than a boast.<\u002Fp>\n          <ul style=\"margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px;\">\n            <li style=\"display:grid; grid-template-columns:14px 1fr; gap:10px; font-size:14px; line-height:1.55; color:#4a525c;\"><span aria-hidden=\"true\" style=\"color:#0e6e5c;\">—<\u002Fspan><span>It has to be true and checkable, not a nicer adjective.<\u002Fspan><\u002Fli>\n            <li style=\"display:grid; grid-template-columns:14px 1fr; gap:10px; font-size:14px; line-height:1.55; color:#4a525c;\"><span aria-hidden=\"true\" style=\"color:#0e6e5c;\">—<\u002Fspan><span>The big company cannot repeat it without arguing against itself.<\u002Fspan><\u002Fli>\n            <li style=\"display:grid; grid-template-columns:14px 1fr; gap:10px; font-size:14px; line-height:1.55; color:#4a525c;\"><span aria-hidden=\"true\" style=\"color:#0e6e5c;\">—<\u002Fspan><span>Get it right before you grow. Surprise only works once.<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Farticle>\n        <article style=\"padding:20px 0 22px; border-top:1px solid #e4e2dc; transition:opacity .35s ease; opacity:{{ act3Op }}\">\n          <div style=\"display:flex; align-items:baseline; gap:10px; margin-bottom:8px;\">\n            <span style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:{{ act3Tone }}\">Act III · the expansion<\u002Fspan>\n            <span style=\"height:1px; flex:1; background:#e4e2dc;\"><\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family:'Iowan Old Style', Georgia, serif; font-weight:400; font-size:26px; line-height:1.15; margin:0 0 10px;\">Pursue in bounded steps<\u002Fh2>\n          <p style=\"margin:0 0 12px; font-size:15px; line-height:1.62; color:#4a525c; text-wrap:pretty;\">Following through matters as much as the first move. Happy customers and their referrals carry the same fact to the next group — one group at a time.<\u002Fp>\n          <ul style=\"margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px;\">\n            <li style=\"display:grid; grid-template-columns:14px 1fr; gap:10px; font-size:14px; line-height:1.55; color:#4a525c;\"><span aria-hidden=\"true\" style=\"color:#0e6e5c;\">—<\u002Fspan><span>Keep the patch — small enough that you can defend it.<\u002Fspan><\u002Fli>\n            <li style=\"display:grid; grid-template-columns:14px 1fr; gap:10px; font-size:14px; line-height:1.55; color:#4a525c;\"><span aria-hidden=\"true\" style=\"color:#0e6e5c;\">—<\u002Fspan><span>Step next door — the closest group with the same problem.<\u002Fspan><\u002Fli>\n            <li style=\"display:grid; grid-template-columns:14px 1fr; gap:10px; font-size:14px; line-height:1.55; color:#4a525c;\"><span aria-hidden=\"true\" style=\"color:#0e6e5c;\">—<\u002Fspan><span>Or redraw the map — your idea becomes the standard question.<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Farticle>\n      <\u002Faside>\n    <\u002Fdiv>\n\n    <section style=\"margin-top:44px; padding-top:28px; border-top:1px solid #e4e2dc;\">\n      <div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:14px; margin-bottom:22px;\">\n        <h2 style=\"font-family:'Iowan Old Style', Georgia, serif; font-weight:400; font-size:{{ h2Size }}; margin:0;\">Three bounded outcomes<\u002Fh2>\n        <p style=\"margin:0; font-size:14px; color:#6b737e;\">Three different endings, not three stages you pass through. Which one you get depends on how far that one fact travels.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:16px;\">\n        <article style=\"padding:20px; border-radius:14px; border:1px solid {{ o1Border }}; background:{{ o1Bg }}; transition:opacity .35s ease, background .35s ease; opacity:{{ o1Op }}\">\n          <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:12px; flex-wrap:wrap;\">\n            <span style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; white-space:nowrap; color:{{ o1Tone }}\">Outcome 1<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; color:#6b737e; letter-spacing:.1em; white-space:nowrap;\">SMALL AREA<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Iowan Old Style', Georgia, serif; font-weight:400; font-size:21px; margin:0 0 8px;\">Narrow hold<\u002Fh3>\n          <p style=\"margin:0 0 14px; font-size:14px; line-height:1.6; color:#4a525c; text-wrap:pretty;\">The fact that convinced this group convinces nobody else. You keep a small, profitable patch — which only works if you stay small enough to defend it.<\u002Fp>\n          <div style=\"height:6px; border-radius:3px; background:#e4e2dc; overflow:hidden;\">\n            <span style=\"display:block; height:100%; border-radius:3px; transition:width .6s ease, background .35s ease; background:{{ o1Tone }}; width:{{ o1Width }}\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <article style=\"padding:20px; border-radius:14px; border:1px solid {{ o2Border }}; background:{{ o2Bg }}; transition:opacity .35s ease, background .35s ease; opacity:{{ o2Op }}\">\n          <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:12px; flex-wrap:wrap;\">\n            <span style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; white-space:nowrap; color:{{ o2Tone }}\">Outcome 2<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; color:#6b737e; letter-spacing:.1em; white-space:nowrap;\">MEDIUM AREA<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Iowan Old Style', Georgia, serif; font-weight:400; font-size:21px; margin:0 0 8px;\">Adjacent move<\u002Fh3>\n          <p style=\"margin:0 0 14px; font-size:14px; line-height:1.6; color:#4a525c; text-wrap:pretty;\">It works, and customers bring you the next ones. You move to the closest group with the same problem — real growth, slow, and still bounded by that one fact.<\u002Fp>\n          <div style=\"height:6px; border-radius:3px; background:#e4e2dc; overflow:hidden;\">\n            <span style=\"display:block; height:100%; border-radius:3px; transition:width .6s ease, background .35s ease; background:{{ o2Tone }}; width:{{ o2Width }}\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <article style=\"padding:20px; border-radius:14px; border:1px solid {{ o3Border }}; background:{{ o3Bg }}; transition:opacity .35s ease, background .35s ease; opacity:{{ o3Op }}\">\n          <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:12px; flex-wrap:wrap;\">\n            <span style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; white-space:nowrap; color:{{ o3Tone }}\">Outcome 3<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:10px; color:#6b737e; letter-spacing:.1em; white-space:nowrap;\">LARGE AREA<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Iowan Old Style', Georgia, serif; font-weight:400; font-size:21px; margin:0 0 8px;\">Category created<\u002Fh3>\n          <p style=\"margin:0 0 14px; font-size:14px; line-height:1.6; color:#4a525c; text-wrap:pretty;\">Your fact changes what the market argues about. A new category appears in your words, and the big companies have to answer your question.<\u002Fp>\n          <div style=\"height:6px; border-radius:3px; background:#e4e2dc; overflow:hidden;\">\n            <span style=\"display:block; height:100%; border-radius:3px; transition:width .6s ease, background .35s ease; background:{{ o3Tone }}; width:{{ o3Width }}\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fdiv>\n      <p style=\"margin:26px 0 0; font-size:13px; line-height:1.6; color:#6b737e; max-width:88ch;\">The method follows Al Ries and Jack Trout's writing on positioning and marketing warfare. The terrain, the segments and the rain-jacket company are invented illustrations — no real company or market is depicted.<\u002Fp>\n      <p style=\"margin:10px 0 0; font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#6b737e;\">Space · play or pause &nbsp;&nbsp; ← → · step &nbsp;&nbsp; ?step=N · deep link<\u002Fp>\n    <\u002Fsection>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;paceSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:5,&quot;min&quot;:2,&quot;max&quot;:10,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Playback&quot;},&quot;startStep&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:6,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Playback&quot;}}\">\nconst STEPS = [\n  { tag: \"Act I · 01\", chips: [\"The mental list\", \"Frontal attack\"],\n    title: \"You cannot win by attacking a big company where it is strongest.\",\n    body: \"Positioning theory starts with one observation: for any need, people keep a very short mental list of who is best at it, and the biggest company is usually already at the top. Attacking it directly means competing on price, on being in every shop, and on advertising — the three things more money simply wins.\",\n    example: \"A two-person rain-jacket company buys ads claiming its jackets beat the household name's. Nobody changes their mind, and the budget runs out.\" },\n  { tag: \"Act I · 02\", chips: [\"Flank\", \"Beachhead\"],\n    title: \"Instead, pick one small group nobody is serving properly.\",\n    body: \"A flank means going somewhere the big company is not standing — not a slightly different version of the same product, but a group of people with a specific problem the big company has no reason to care about. That group is your beachhead: the first patch of ground you take and hold.\",\n    example: \"Winter dog walkers: out at six in the morning, in the rain, twenty minutes, twice a day, every day. No outdoor brand designs for that trip.\" },\n  { tag: \"Act I · 03\", chips: [\"Trigger, need, will pay\", \"Say one thing\"],\n    title: \"Describe that group by its situation, not its age or income.\",\n    body: \"\\\"Women, 30 to 50, city dwellers\\\" tells you nothing about what to build or say. Three things do: the moment the problem bites (the trigger), what they cannot get today (the need), and evidence they will pay more to fix it. Then say one thing about yourself, and only that one thing, everywhere.\",\n    example: \"Trigger: the six a.m. walk. Need: a jacket you can pull on over pyjamas that is dry again by the evening walk. Evidence: these buyers replace jackets twice as often as hikers do.\" },\n  { tag: \"Act II · 04\", chips: [\"The wedge\", \"Proof, not adjectives\"],\n    title: \"Find the one true fact that makes the usual advice wrong here.\",\n    body: \"The wedge is a checkable fact everyone else overlooked — not a slogan. It explains why the obvious choice fails these particular people, so your claim stops sounding like bragging and starts sounding like an explanation. Get this straight before you try to grow.\",\n    example: \"Rain jackets are tested in hours-long hiking downpours and then dried overnight. A dog walker's jacket gets twenty minutes of rain and eight hours indoors, so drying speed matters more than waterproof rating. Measurable — and not what the big brand talks about.\" },\n  { tag: \"Act III · 05\", chips: [\"Narrow hold\", \"Stay defensible\"],\n    title: \"Outcome one: you keep the small patch, and nothing more.\",\n    body: \"Sometimes the fact that convinced this group convinces nobody else. You end up with a small, profitable territory you can defend — which works only if you stay small enough to defend it: low overheads, and your name kept on the one product it means.\",\n    example: \"The company owns dawn dog-walking gear in one climate. Loyal repeat buyers, steady margins, no wider fame.\" },\n  { tag: \"Act III · 06\", chips: [\"Adjacent step\", \"One at a time\"],\n    title: \"Outcome two: you move to the nearest similar group.\",\n    body: \"If it works, the people you served bring you the next ones. You step to the closest neighbouring group — same underlying problem, same fact doing the explaining — and no further. One step at a time, never by putting your name on unrelated products.\",\n    example: \"Next along: people cycling to work at dawn in the same weather. Same twenty-minute soaking, same need to be dry by evening.\" },\n  { tag: \"Act III · 07\", chips: [\"New category\", \"You set the question\"],\n    title: \"Outcome three: your idea becomes the way everyone thinks.\",\n    body: \"Occasionally the fact is so useful that it changes what the whole market argues about. A new category appears, described in your words, and the big companies have to answer your question instead of you answering theirs.\",\n    example: \"\\\"Everyday rain gear\\\" becomes its own shelf, judged on drying time. The household name starts publishing drying times too — on ground you defined.\" }\n];\n\nconst ACT_RANGE = [[0, 2], [3, 3], [4, 6]];\nconst OUT = [{ step: 4, w: \"22%\" }, { step: 5, w: \"56%\" }, { step: 6, w: \"100%\" }];\n\nconst ROWS = 52, COLS = 96, SEA = 0.02, BOT = 752;\n\nfunction P(u, v, h) { return [600 + (u - v) * 470, 244 + (u + v) * 214 - h * 158]; }\n\nfunction hf(u, v) {\n  const g = (cu, cv, su, sv) => Math.exp(-((u - cu) * (u - cu) / su + (v - cv) * (v - cv) / sv));\n  let h = 0.95 * g(0.22, 0.26, 0.075, 0.085)\n    + 0.44 * g(0.52, 0.11, 0.03, 0.045)\n    + 0.30 * g(0.13, 0.55, 0.03, 0.04)\n    + 0.34 * g(0.81, 0.21, 0.045, 0.05)\n    + 0.24 * g(0.62, 0.54, 0.05, 0.05)\n    + 0.20 * g(0.30, 0.78, 0.06, 0.05)\n    + 0.17 * g(0.86, 0.77, 0.028, 0.03)\n    + 0.05 * Math.sin(11 * u + 1.3) * Math.cos(9 * v + 0.7)\n    + 0.035 * Math.sin(19 * v + 2.1) * Math.cos(17 * u);\n  h -= 0.6 * Math.max(0, Math.min(1, (u + v - 1.62) / 0.32));\n  h -= 0.35 * Math.max(0, Math.min(1, (0.34 - u - v) / 0.3));\n  return Math.max(0, h);\n}\n\nconst POLY = {\n  inc: [[0.02, 0.08], [0.40, 0.03], [0.50, 0.30], [0.40, 0.52], [0.12, 0.58], [0.00, 0.32]],\n  segC: [[0.58, 0.05], [0.95, 0.03], [1.00, 0.30], [0.80, 0.43], [0.62, 0.33]],\n  segB: [[0.47, 0.39], [0.72, 0.33], [0.83, 0.52], [0.72, 0.67], [0.51, 0.62]],\n  segA: [[0.73, 0.59], [0.95, 0.55], [1.02, 0.80], [0.88, 1.00], [0.71, 0.86]],\n  segD: [[0.13, 0.62], [0.44, 0.57], [0.53, 0.76], [0.4
