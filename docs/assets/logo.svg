<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#g)" opacity="0.1"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#g)" stroke-width="2"/>
  <!-- Pulse line -->
  <polyline points="30,120 55,120 65,80 75,130 85,70 95,120 105,90 115,130 125,80 135,110 145,75 170,120"
            fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Circuit nodes -->
  <circle cx="55" cy="120" r="4" fill="#22c55e"/>
  <circle cx="85" cy="70" r="4" fill="#22c55e"/>
  <circle cx="145" cy="75" r="4" fill="#22c55e"/>
  <!-- Eye/observation mark -->
  <circle cx="100" cy="160" r="12" fill="none" stroke="#22c55e" stroke-width="2"/>
  <circle cx="100" cy="160" r="4" fill="#22c55e"/>
  <text x="100" y="185" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748b" font-weight="600">OBSERVECO</text>
</svg>